# Postdoc Radarı botu
# Günde 3 kez ilan sitelerini tarar, sonucu docs/jobs.json'a kaydeder,
# yeni ilanları Telegram'a gönderir ve GitHub Pages panosunu günceller.
name: Postdoc taraması

on:
  schedule:
    # Saatler UTC'dir. Türkiye = UTC+3. Aşağıdaki satır: 08:07, 13:07 ve 19:07 (Türkiye saati)
    # Biçim: dakika saat gün ay haftanın-günü  →  https://crontab.guru ile deneyebilirsin
    - cron: "7 5,10,16 * * *"
  workflow_dispatch:          # Actions sekmesindeki "Run workflow" düğmesi
    inputs:
      test_telegram:
        description: "Sadece Telegram bağlantısını test et (tarama yapma)"
        type: boolean
        default: false
  push:                       # web sayfasını değiştirdiğinde panoyu yeniden yayınla
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write    # docs/jobs.json'u depoya kaydetmek için
  pages: write       # GitHub Pages'e yayınlamak için
  id-token: write

concurrency:
  group: postdoc-radar
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Europe/Istanbul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Paketleri kur
        run: npm ci

      - name: Telegram testi
        if: ${{ inputs.test_telegram }}
        run: node bot/run.mjs --test-telegram

      - name: İlanları tara
        if: ${{ !inputs.test_telegram }}
        run: node bot/run.mjs

      - name: Sonuçları depoya kaydet
        if: ${{ !inputs.test_telegram }}
        run: |
          git config user.name "postdoc-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Tarama: $(date '+%d.%m.%Y %H:%M')"
            git pull --rebase --autostash
            git push
          fi

  pages:
    needs: scan
    if: ${{ always() && (needs.scan.result == 'success' || needs.scan.result == 'skipped') && !inputs.test_telegram }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Güncel depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        name: GitHub Pages'e yayınla
        uses: actions/deploy-pages@v4
